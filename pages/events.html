<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4F46E5">
    <title>Eventos - Caimán</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐊</text></svg>">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="logo">🐊</span>
                <h2>Caimán</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Inicio</a>
                <a href="songs.html"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html" class="active"><span class="icon">📅</span> Eventos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Config</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-info">
                        <h4 id="userName">Usuario</h4>
                        <span id="userRole">Rol</span>
                    </div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Salir</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Eventos</h1>
                <button class="btn btn-primary" onclick="openEventModal()">+ Nuevo</button>
            </div>

            <div class="card">
                <div class="search-filters">
                    <div class="view-toggle">
                        <button class="active" onclick="setView('list')">Lista</button>
                        <button onclick="setView('month')">Calendario</button>
                        <button onclick="setView('week')">Semana</button>
                    </div>
                    <input type="month" id="filterMonth" onchange="loadEvents()">
                    <select id="filterStatus" onchange="renderEvents()">
                        <option value="">Todos</option>
                        <option value="confirmed">Confirmados</option>
                        <option value="tentative">Tentativos</option>
                        <option value="cancelled">Cancelados</option>
                    </select>
                </div>

                <div id="eventsContainer">
                    <div class="loading">Cargando...</div>
                </div>
            </div>
        </main>
    </div>

    <nav class="mobile-nav">
        <a href="dashboard.html"><span class="icon">📊</span>Inicio</a>
        <a href="songs.html"><span class="icon">🎵</span>Canciones</a>
        <a href="setlists.html"><span class="icon">📋</span>Set Lists</a>
        <a href="events.html" class="active"><span class="icon">📅</span>Eventos</a>
        <a href="settings.html"><span class="icon">⚙️</span>Config</a>
    </nav>

    <div class="mobile-user">
        <div class="user-avatar" id="mobileUserAvatar">U</div>
        <div class="user-info">
            <h4 id="mobileUserName">Usuario</h4>
            <span id="mobileUserRole">Rol</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>
    </div>

    <!-- Modal Event -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="eventModalTitle">Nuevo Evento</h3>
                <button class="modal-close" onclick="closeEventModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="eventId">
                <div class="form-group">
                    <label>Nombre del evento *</label>
                    <input type="text" id="eventName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Fecha *</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" id="eventCity">
                    </div>
                </div>
                <div class="form-group">
                    <label>Lugar</label>
                    <input type="text" id="eventVenue">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Hora inicio</label>
                        <input type="time" id="eventStartTime">
                    </div>
                    <div class="form-group">
                        <label>Hora fin</label>
                        <input type="time" id="eventEndTime">
                    </div>
                </div>
                <div class="form-group">
                    <label>Set List</label>
                    <select id="eventSetlist"></select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="eventStatus">
                            <option value="confirmed">Confirmado</option>
                            <option value="tentative">Tentativo</option>
                            <option value="cancelled">Cancelado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Pago</label>
                        <input type="number" id="eventPayment" placeholder="0.00">
                    </div>
                </div>
                <div class="form-group">
                    <label>Notas</label>
                    <textarea id="eventNotes" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeEventModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveEvent()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal View Event -->
    <div class="modal-overlay" id="viewEventModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="viewEventTitle">Evento</h3>
                <button class="modal-close" onclick="closeViewEventModal()">&times;</button>
            </div>
            <div class="modal-body" id="viewEventContent"></div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeViewEventModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/events.js"></script>
</body>
</html>
