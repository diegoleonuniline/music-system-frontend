<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Eventos - Music System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <meta name="theme-color" content="#ffffff" id="themeColor">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1>Eventos</h1>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
                </div>
            </div>
        </header>

        <main class="main">
            <!-- Filtro mes -->
            <div class="form-group">
                <input type="month" class="form-input" id="filterMonth" onchange="loadData()" style="text-align:center">
            </div>

            <!-- Lista eventos -->
            <div class="card">
                <div class="card-body no-padding" id="eventsList">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </main>

        <button class="fab" onclick="openEventModal()">+</button>

        <nav class="nav">
            <div class="nav-items">
                <a href="dashboard.html" class="nav-item"><span class="icon">🏠</span>Inicio</a>
                <a href="songs.html" class="nav-item"><span class="icon">🎵</span>Canciones</a>
                <a href="setlists.html" class="nav-item"><span class="icon">📋</span>Set Lists</a>
                <a href="events.html" class="nav-item active"><span class="icon">📅</span>Eventos</a>
                <a href="settings.html" class="nav-item"><span class="icon">⚙️</span>Config</a>
            </div>
        </nav>
    </div>

    <!-- Modal Evento -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal" style="max-height: 90vh;">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="eventModalTitle">Nuevo Evento</h3>
                <button class="modal-close" onclick="closeModal('eventModal')">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="eventId">
                <div class="form-group">
                    <label class="form-label">Nombre *</label>
                    <input type="text" class="form-input" id="eventName" placeholder="Nombre del evento">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Fecha *</label>
                        <input type="date" class="form-input" id="eventDate">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ciudad</label>
                        <input type="text" class="form-input" id="eventCity" placeholder="Ciudad">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Lugar</label>
                    <input type="text" class="form-input" id="eventVenue" placeholder="Nombre del lugar">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Hora inicio</label>
                        <input type="time" class="form-input" id="eventStart">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Hora fin</label>
                        <input type="time" class="form-input" id="eventEnd">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Set List</label>
                    <select class="form-input" id="eventSetlist"></select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Uniforme</label>
                        <input type="text" class="form-input" id="eventUniform" placeholder="Ej: Negro">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Pago</label>
                        <input type="number" class="form-input" id="eventPayment" placeholder="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Estado</label>
                        <select class="form-input" id="eventStatus">
                            <option value="confirmed">Confirmado</option>
                            <option value="tentative">Tentativo</option>
                            <option value="cancelled">Cancelado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Estado pago</label>
                        <select class="form-input" id="eventPayStatus">
                            <option value="pending">Pendiente</option>
                            <option value="partial">Parcial</option>
                            <option value="paid">Pagado</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Notas</label>
                    <textarea class="form-input" id="eventNotes" rows="2" placeholder="Notas..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('eventModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveEvent()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Ver Evento -->
    <div class="modal-overlay" id="viewEventModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="viewEventTitle">Evento</h3>
                <button class="modal-close" onclick="closeModal('viewEventModal')">×</button>
            </div>
            <div class="modal-body" id="viewEventContent"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('viewEventModal')">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/events.js"></script>
</body>
</html>
