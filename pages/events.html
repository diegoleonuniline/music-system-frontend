<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#4F46E5">
    <title>Eventos - Caimán</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐊</text></svg>">
</head>
<body>
    <header class="mobile-header">
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <span class="logo">🐊</span>
        <h1>Eventos</h1>
    </header>
    <div class="sidebar-overlay" onclick="closeMobileMenu()"></div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header"><span class="logo">🐊</span><h2>Caimán</h2></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Inicio</a>
                <a href="songs.html"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html" class="active"><span class="icon">📅</span> Eventos</a>
                <a href="rehearsals.html"><span class="icon">🎸</span> Ensayos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-info"><h4 id="userName">Usuario</h4><span id="userRole">Rol</span></div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Eventos</h1>
                <button class="btn btn-primary" onclick="openEventModal()">+ Nuevo</button>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="search-filters">
                        <div class="view-toggle">
                            <button class="active" onclick="setViewMode('cards')">Tarjetas</button>
                            <button onclick="setViewMode('table')">Tabla</button>
                        </div>
                    </div>
                </div>
                <div id="eventsContainer"><div class="loading">Cargando...</div></div>
            </div>
        </main>
    </div>

    <nav class="mobile-nav">
        <a href="dashboard.html"><span class="icon">📊</span>Inicio</a>
        <a href="songs.html"><span class="icon">🎵</span>Canciones</a>
        <a href="setlists.html"><span class="icon">📋</span>Set Lists</a>
        <a href="events.html" class="active"><span class="icon">📅</span>Eventos</a>
        <a href="rehearsals.html"><span class="icon">🎸</span>Ensayos</a>
    </nav>

    <!-- Modal Ver Evento -->
    <div class="modal-overlay" id="viewEventModal">
        <div class="modal" style="max-width: 550px;">
            <div class="modal-header">
                <h3>📅 Evento</h3>
                <button class="modal-close" onclick="closeViewEventModal()">&times;</button>
            </div>
            <div class="modal-body">
                <h2 id="viewEventName" style="margin-bottom: 20px;"></h2>
                <div style="display: grid; gap: 16px;">
                    <div class="event-detail-row">
                        <span class="event-detail-icon">📆</span>
                        <div>
                            <strong>Fecha y Hora</strong>
                            <p id="viewEventDate"></p>
                        </div>
                    </div>
                    <div class="event-detail-row">
                        <span class="event-detail-icon">📍</span>
                        <div>
                            <strong>Lugar</strong>
                            <p id="viewEventVenue"></p>
                        </div>
                    </div>
                    <div id="viewEventMaps" style="margin-left: 36px;"></div>
                    <div class="event-detail-row">
                        <span class="event-detail-icon">👔</span>
                        <div>
                            <strong>Uniforme</strong>
                            <p id="viewEventUniform"></p>
                        </div>
                    </div>
                    <div class="event-detail-row">
                        <span class="event-detail-icon">📋</span>
                        <div>
                            <strong>Set List</strong>
                            <p id="viewEventSetlist"></p>
                        </div>
                    </div>
                    <div class="event-detail-row">
                        <span class="event-detail-icon">✓</span>
                        <div>
                            <strong>Estado</strong>
                            <p id="viewEventStatus"></p>
                        </div>
                    </div>
                    <div style="background: var(--bg-secondary); padding: 14px; border-radius: 10px; margin-top: 8px;">
                        <strong style="font-size: 14px;">📝 Notas</strong>
                        <div id="viewEventNotes" style="margin-top: 8px; color: var(--text-secondary);"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="editCurrentEvent()">✏️ Editar</button>
                <button class="btn btn-danger" onclick="deleteCurrentEvent()">🗑️ Eliminar</button>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar Evento -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="eventModalTitle">Nuevo Evento</h3>
                <button class="modal-close" onclick="closeEventModal()">&times;</button>
            </div>
            <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
                <input type="hidden" id="eventId">
                
                <div class="form-group">
                    <label>Nombre del Evento *</label>
                    <input type="text" id="eventName" required placeholder="Ej: Boda García López">
                </div>
                
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Fecha *</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label>Hora Inicio</label>
                        <input type="time" id="eventStartTime">
                    </div>
                    <div class="form-group">
                        <label>Hora Fin</label>
                        <input type="time" id="eventEndTime">
                    </div>
                </div>
                
                <div class="form-section-title">📍 Ubicación</div>
                
                <div class="form-group">
                    <label>Nombre del Lugar</label>
                    <input type="text" id="eventVenue" placeholder="Ej: Salón Los Arcos">
                </div>
                
                <div class="form-row" style="display: grid; grid-template-columns: 2fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" id="eventAddress" placeholder="Calle, número, colonia">
                    </div>
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" id="eventCity" placeholder="Ej: Guadalajara">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Link Google Maps</label>
                    <input type="url" id="eventGoogleMaps" placeholder="https://maps.google.com/...">
                </div>
                
                <div class="form-section-title">🎵 Detalles</div>
                
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Uniforme</label>
                        <input type="text" id="eventUniform" placeholder="Ej: Camisa negra, pantalón negro">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="eventStatus">
                            <option value="tentative">Tentativo</option>
                            <option value="confirmed">Confirmado</option>
                            <option value="cancelled">Cancelado</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Set List</label>
                    <select id="eventSetlist"></select>
                </div>
                
                <div class="form-group">
                    <label>Notas</label>
                    <textarea id="eventNotes" rows="3" placeholder="Indicaciones especiales, contacto del cliente, etc..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeEventModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveEvent()">Guardar</button>
            </div>
        </div>
    </div>

    <style>
        .event-detail-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .event-detail-icon {
            font-size: 20px;
            min-width: 24px;
            text-align: center;
        }
        .event-detail-row strong {
            font-size: 13px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 2px;
        }
        .event-detail-row p {
            font-size: 15px;
            margin: 0;
        }
        .form-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 20px 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .event-card-actions {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            gap: 4px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr !important;
            }
        }
    </style>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/events.js"></script>
</body>
</html>
