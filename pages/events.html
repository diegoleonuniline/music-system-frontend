<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" id="themeColor" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Eventos - Music System Pro</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1>Eventos</h1>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
                </div>
            </div>
        </header>

        <main class="main">
            <!-- Controls -->
            <div style="display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); flex-wrap: wrap; align-items: center;">
                <input type="month" class="form-input" id="filterMonth" onchange="loadEvents()" style="flex: 1; min-width: 150px;">
                <select class="form-input" id="filterStatus" onchange="renderEvents()" style="width: auto;">
                    <option value="">Todos</option>
                    <option value="confirmed">Confirmados</option>
                    <option value="tentative">Tentativos</option>
                    <option value="cancelled">Cancelados</option>
                </select>
            </div>

            <!-- View Toggle -->
            <div class="view-toggle" style="margin-bottom: var(--space-lg);">
                <button class="view-toggle-btn active" onclick="setView('list')" id="viewList">Lista</button>
                <button class="view-toggle-btn" onclick="setView('table')" id="viewTable">Tabla</button>
                <button class="view-toggle-btn" onclick="setView('calendar')" id="viewCalendar">Mes</button>
                <button class="view-toggle-btn" onclick="setView('week')" id="viewWeek">Semana</button>
            </div>

            <!-- Events Container -->
            <div class="card">
                <div class="card-body no-padding" id="eventsContainer">
                    <div class="loading"><div class="spinner"></div>Cargando...</div>
                </div>
            </div>
        </main>

        <button class="fab admin-only" onclick="openEventModal()">+</button>

        <nav class="nav">
            <div class="nav-logo"><div class="nav-logo-icon">🎵</div>Music Pro</div>
            <div class="nav-items">
                <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span>Inicio</span></a>
                <a href="songs.html" class="nav-item"><span class="icon">🎵</span><span>Canciones</span></a>
                <a href="setlists.html" class="nav-item"><span class="icon">📋</span><span>Set Lists</span></a>
                <a href="events.html" class="nav-item active"><span class="icon">📅</span><span>Eventos</span></a>
                <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span>Config</span></a>
            </div>
            <div class="nav-profile">
                <div class="nav-profile-avatar" id="navUserAvatar">U</div>
                <div class="nav-profile-info">
                    <div class="nav-profile-name" id="navUserName">Usuario</div>
                    <div class="nav-profile-role" id="navUserRole">Músico</div>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>
            </div>
        </nav>
    </div>

    <!-- Modal Event CRUD -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="eventModalTitle">Nuevo Evento</h3>
                <button class="modal-close" onclick="closeModal('eventModal')">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="eventId">
                <div class="form-group">
                    <label class="form-label">Nombre del evento *</label>
                    <input type="text" class="form-input" id="eventName" placeholder="Ej: Boda García">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Fecha *</label>
                        <input type="date" class="form-input" id="eventDate">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Estado</label>
                        <select class="form-input" id="eventStatus">
                            <option value="confirmed">Confirmado</option>
                            <option value="tentative">Tentativo</option>
                            <option value="cancelled">Cancelado</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Lugar</label>
                    <input type="text" class="form-input" id="eventVenue" placeholder="Nombre del lugar">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Ciudad</label>
                        <input type="text" class="form-input" id="eventCity" placeholder="Ciudad">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-input" id="eventAddress" placeholder="Dirección">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Hora inicio</label>
                        <input type="time" class="form-input" id="eventStartTime">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Hora fin</label>
                        <input type="time" class="form-input" id="eventEndTime">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Google Maps URL</label>
                    <input type="url" class="form-input" id="eventMapsUrl" placeholder="https://maps.google.com/...">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Set List</label>
                        <select class="form-input" id="eventSetlist"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Uniforme</label>
                        <input type="text" class="form-input" id="eventUniform" placeholder="Ej: Negro formal">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Pago $</label>
                        <input type="number" class="form-input" id="eventPayment" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Estado pago</label>
                        <select class="form-input" id="eventPaymentStatus">
                            <option value="pending">Pendiente</option>
                            <option value="partial">Parcial</option>
                            <option value="paid">Pagado</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Notas</label>
                    <textarea class="form-input" id="eventNotes" rows="2" placeholder="Notas adicionales..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('eventModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveEvent()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal View Event -->
    <div class="modal-overlay" id="viewEventModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="viewEventTitle">Evento</h3>
                <button class="modal-close" onclick="closeModal('viewEventModal')">✕</button>
            </div>
            <div class="modal-body" id="viewEventContent"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('viewEventModal')">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/events.js"></script>
</body>
</html>
