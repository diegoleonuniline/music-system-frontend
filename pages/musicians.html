<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Músicos - Music System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<meta name="theme-color" content="#0d0d0d">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🎵 Music System</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
                <a href="songs.html"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html"><span class="icon">📅</span> Eventos</a>
                <a href="rehearsals.html"><span class="icon">🎸</span> Ensayos</a>
                <a href="musicians.html" class="active"><span class="icon">👥</span> Músicos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Config</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-details">
                        <h4 id="userName">Usuario</h4>
                        <span id="userRole">Rol</span>
                    </div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Músicos</h1>
                <button class="btn btn-primary" id="btnAddMusician" onclick="openModal()">+ Nuevo músico</button>
            </div>

            <div class="card" id="planInfo">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h3 id="planName" style="margin-bottom: 4px;">Plan</h3>
                        <p id="planDescription" style="color: var(--text-tertiary); font-size: 13px;"></p>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 28px; font-weight: 700; color: var(--text-primary);">
                            <span id="currentMusicians">0</span> / <span id="maxMusicians">0</span>
                        </div>
                        <small style="color: var(--text-tertiary);">músicos</small>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="planProgress"></div>
                </div>
            </div>

            <div class="card">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Músico</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="musiciansList">
                            <tr><td colspan="6"><div class="loading">Cargando</div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Músico -->
    <div class="modal-overlay" id="musicianModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Músico</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="musicianForm">
                    <input type="hidden" id="musicianId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" id="musicianFirstName" required placeholder="Nombre">
                        </div>
                        <div class="form-group">
                            <label>Apellido</label>
                            <input type="text" id="musicianLastName" placeholder="Apellido">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="musicianEmail" required placeholder="correo@ejemplo.com">
                    </div>
                    
                    <div class="form-group" id="passwordGroup">
                        <label>Contraseña *</label>
                        <input type="password" id="musicianPassword" placeholder="Mínimo 6 caracteres">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="tel" id="musicianPhone" placeholder="Teléfono">
                        </div>
                        <div class="form-group">
                            <label>Rol</label>
                            <select id="musicianRole">
                                <option value="musician">Músico</option>
                                <option value="group_admin">Administrador</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveMusician()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Contraseña -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h3>Cambiar Contraseña</h3>
                <button class="modal-close" onclick="closePasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="passwordUserId">
                <div class="form-group">
                    <label>Nueva contraseña</label>
                    <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="Repetir contraseña">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closePasswordModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="changePassword()">Cambiar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/musicians.js"></script>
</body>
</html>
