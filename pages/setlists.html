<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4F46E5">
    <title>Set Lists - Caimán</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐊</text></svg>">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="logo">🐊</span>
                <h2>Caimán</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Inicio</a>
                <a href="songs.html"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html" class="active"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html"><span class="icon">📅</span> Eventos</a>
                <a href="rehearsals.html"><span class="icon">🎸</span> Ensayos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Config</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-info">
                        <h4 id="userName">Usuario</h4>
                        <span id="userRole">Rol</span>
                    </div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Salir</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Set Lists</h1>
                <button class="btn btn-primary" onclick="openSetlistModal()">+ Nuevo</button>
            </div>

            <div class="setlist-grid" id="setlistsGrid">
                <div class="loading">Cargando...</div>
            </div>
        </main>
    </div>

    <nav class="mobile-nav">
        <a href="dashboard.html"><span class="icon">📊</span>Inicio</a>
        <a href="songs.html"><span class="icon">🎵</span>Canciones</a>
        <a href="setlists.html" class="active"><span class="icon">📋</span>Set Lists</a>
        <a href="events.html"><span class="icon">📅</span>Eventos</a>
        <a href="rehearsals.html"><span class="icon">🎸</span>Ensayos</a>
    </nav>

    <!-- Modal Create/Edit Setlist -->
    <div class="modal-overlay" id="setlistModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="setlistModalTitle">Nuevo Set List</h3>
                <button class="modal-close" onclick="closeSetlistModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="setlistId">
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" id="setlistName" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="setlistDescription" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeSetlistModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveSetlist()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal View Setlist -->
    <div class="modal-overlay" id="viewSetlistModal">
        <div class="modal" style="max-width: 700px;">
            <div class="modal-header">
                <h3 id="viewSetlistTitle">Set List</h3>
                <button class="modal-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                    <div style="display: flex; gap: 8px;">
                        <span class="badge badge-primary" id="viewTotalSongs">0 canciones</span>
                        <span class="badge badge-neutral" id="viewTotalDuration">0:00</span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-ghost btn-sm" onclick="openAddSongModal()">+ Agregar</button>
                        <button class="btn btn-primary btn-sm" onclick="openStageMode()">🎤 Escenario</button>
                    </div>
                </div>
                <div id="setlistSongs"></div>
            </div>
        </div>
    </div>

    <!-- Modal Add Song -->
    <div class="modal-overlay" id="addSongModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Agregar Canción</h3>
                <button class="modal-close" onclick="closeAddSongModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <input type="text" id="searchSongInput" placeholder="Buscar canción..." onkeyup="filterAvailableSongs()">
                </div>
                <div id="availableSongs" style="max-height: 300px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <!-- Stage Mode -->
    <div class="modal-overlay" id="stageModeModal" style="background: #000; padding: 0;">
        <div class="stage-mode" style="width: 100%; height: 100%;">
            <div class="stage-header">
                <h2 id="stageModeTitle">Set List</h2>
                <button class="btn btn-danger btn-sm" onclick="closeStageMode()">✕ Salir</button>
            </div>
            <div class="stage-content" id="stageModeContent"></div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/setlists.js"></script>
</body>
</html>
