<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4F46E5">
    <title>Set Lists - Caimán</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐊</text></svg>">
</head>
<body>
    <div class="offline-indicator">📴 Sin conexión - Modo offline</div>
    
    <header class="mobile-header">
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <span class="logo">🐊</span>
        <h1>Set Lists</h1>
    </header>
    <div class="sidebar-overlay" onclick="closeMobileMenu()"></div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header"><span class="logo">🐊</span><h2>Caimán</h2></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Inicio</a>
                <a href="songs.html"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html" class="active"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html"><span class="icon">📅</span> Eventos</a>
                <a href="rehearsals.html"><span class="icon">🎸</span> Ensayos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-info"><h4 id="userName">Usuario</h4><span id="userRole">Rol</span></div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Set Lists</h1>
                <button class="btn btn-primary" onclick="openSetlistModal()">+ Nuevo</button>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="view-toggle">
                        <button class="active" onclick="setViewMode('table')">Tabla</button>
                        <button onclick="setViewMode('cards')">Tarjetas</button>
                    </div>
                </div>
                <div id="setlistsContainer"><div class="loading">Cargando...</div></div>
            </div>
        </main>
    </div>

    <nav class="mobile-nav">
        <a href="dashboard.html"><span class="icon">📊</span>Inicio</a>
        <a href="songs.html"><span class="icon">🎵</span>Canciones</a>
        <a href="setlists.html" class="active"><span class="icon">📋</span>Set Lists</a>
        <a href="events.html"><span class="icon">📅</span>Eventos</a>
        <a href="rehearsals.html"><span class="icon">🎸</span>Ensayos</a>
    </nav>

    <!-- Modal Ver Set List -->
    <div class="modal-overlay" id="viewSetlistModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3>📋 <span id="viewSetlistTitle"></span></h3>
                <button class="modal-close" onclick="closeViewModal()">×</button>
            </div>
            <div class="modal-body">
                <div style="display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;">
                    <span id="viewTotalSongs" style="font-size:14px;color:var(--text-secondary);"></span>
                    <span id="viewTotalDuration" style="font-size:14px;color:var(--text-secondary);"></span>
                </div>
                <div id="setlistSongs"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeViewModal()">Cerrar</button>
                <button class="btn btn-ghost" onclick="openAddSongModal()">+ Agregar Canción</button>
                <button class="btn btn-primary" onclick="openStageMode()">🎤 Modo Escenario</button>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar Set List -->
    <div class="modal-overlay" id="setlistModal">
        <div class="modal modal-md">
            <div class="modal-header">
                <h3 id="setlistModalTitle">Nuevo Set List</h3>
                <button class="modal-close" onclick="closeSetlistModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="setlistId">
                <div class="form-group"><label>Nombre *</label><input type="text" id="setlistName" class="form-control" required></div>
                <div class="form-group"><label>Descripción</label><textarea id="setlistDescription" class="form-control" rows="3"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeSetlistModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveSetlist()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Agregar Canción -->
    <div class="modal-overlay" id="addSongModal">
        <div class="modal modal-md">
            <div class="modal-header">
                <h3>Agregar Canción</h3>
                <button class="modal-close" onclick="closeAddSongModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><input type="text" id="searchSongInput" class="form-control" placeholder="Buscar canción..." oninput="filterAvailableSongs()"></div>
                <div id="availableSongs" style="max-height:300px;overflow-y:auto;"></div>
            </div>
        </div>
    </div>

    <!-- Modal Ver Letra -->
    <div class="modal-overlay" id="lyricsModal">
        <div class="modal modal-lg">
            <div class="modal-header"><h3 id="lyricsModalTitle">Letra</h3><button class="modal-close" onclick="closeLyricsModal()">×</button></div>
            <div class="modal-body"><div id="lyricsContent" style="font-size:16px;line-height:1.8;white-space:pre-wrap;"></div></div>
            <div class="modal-footer"><button class="btn btn-ghost" onclick="closeLyricsModal()">Cerrar</button></div>
        </div>
    </div>

    <!-- Modal Recursos -->
    <div class="modal-overlay" id="resourcesModal">
        <div class="modal modal-lg">
            <div class="modal-header"><h3>📎 Recursos: <span id="resourcesSongName"></span></h3><button class="modal-close" onclick="closeResourcesModal()">×</button></div>
            <div class="modal-body">
                <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
                    <select id="resourcesFilter" class="form-control" style="flex:1;min-width:150px;" onchange="loadResources()"><option value="all">Todos</option><option value="lyrics">Letras</option><option value="chords">Acordes</option><option value="tabs">Tablaturas</option><option value="notes">Notas</option><option value="pdf">PDFs</option><option value="image">Imágenes</option></select>
                    <button class="btn btn-primary" onclick="openAddResourceModal()">+ Agregar</button>
                </div>
                <div id="resourcesList"></div>
            </div>
        </div>
    </div>

    <!-- Modal Ver Recurso -->
    <div class="modal-overlay" id="viewResourceModal">
        <div class="modal modal-lg">
            <div class="modal-header"><h3 id="viewResourceTitle">Recurso</h3><button class="modal-close" onclick="closeViewResourceModal()">×</button></div>
            <div class="modal-body"><div id="viewResourceContent" style="max-height:60vh;overflow:auto;"></div></div>
            <div class="modal-footer"><button class="btn btn-ghost" onclick="closeViewResourceModal()">Cerrar</button></div>
        </div>
    </div>

    <!-- Modal Agregar Recurso -->
    <div class="modal-overlay" id="addResourceModal">
        <div class="modal modal-md">
            <div class="modal-header"><h3>Agregar Recurso</h3><button class="modal-close" onclick="closeAddResourceModal()">×</button></div>
            <div class="modal-body">
                <div class="form-group"><label>Tipo</label><select id="resourceType" class="form-control" onchange="toggleResourceContentType()"><option value="notes">Notas</option><option value="lyrics">Letra</option><option value="chords">Acordes</option><option value="tabs">Tablatura</option><option value="pdf">PDF</option><option value="image">Imagen</option></select></div>
                <div class="form-group"><label>Título</label><input type="text" id="resourceTitle" class="form-control"></div>
                <div id="resourceContentGroup" class="form-group"><label>Contenido</label><textarea id="resourceContent" class="form-control" rows="8"></textarea></div>
                <div id="resourceFileGroup" class="form-group" style="display:none;"><label>Archivo</label><input type="file" id="resourceFileInput" class="form-control"><div id="uploadProgress" style="display:none;margin-top:8px;"><div style="background:var(--bg-tertiary);border-radius:4px;height:8px;"><div id="uploadProgressBar" style="background:var(--primary);height:100%;border-radius:4px;width:0%;"></div></div><span id="uploadProgressText"></span></div></div>
                <div class="form-group"><label><input type="checkbox" id="resourceShared" checked> 🌐 Compartir</label></div>
            </div>
            <div class="modal-footer"><button class="btn btn-ghost" onclick="closeAddResourceModal()">Cancelar</button><button class="btn btn-primary" onclick="saveResource()">Guardar</button></div>
        </div>
    </div>

    <!-- Stage Mode -->
    <div class="modal-overlay" id="stageModeModal" style="background:#000;">
        <div class="stage-mode">
            <div class="stage-header">
                <button class="btn btn-ghost" onclick="closeStageMode()" style="color:#fff;">✕ Salir</button>
                <h2 id="stageModeTitle"></h2>
                <button id="stageThemeBtn" class="btn btn-ghost" onclick="toggleStageTheme()" style="color:#fff;">☀️ Claro</button>
            </div>
            <div class="stage-content" id="stageModeContent"></div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/setlists.js"></script>
</body>
</html>
