<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#4F46E5">
    <title>Ensayos - Caimán</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐊</text></svg>">
</head>
<body>
    <header class="mobile-header">
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <span class="logo">🐊</span>
        <h1>Ensayos</h1>
    </header>
    <div class="sidebar-overlay" onclick="closeMobileMenu()"></div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header"><span class="logo">🐊</span><h2>Caimán</h2></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Inicio</a>
                <a href="songs.html"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html"><span class="icon">📅</span> Eventos</a>
                <a href="rehearsals.html" class="active"><span class="icon">🎸</span> Ensayos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-info"><h4 id="userName">Usuario</h4><span id="userRole">Rol</span></div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Ensayos</h1>
                <button class="btn btn-primary" onclick="openAddRehearsalModal()">+ Agregar</button>
            </div>

            <div class="card">
                <div id="rehearsalsContainer"><div class="loading">Cargando...</div></div>
            </div>
        </main>
    </div>

    <nav class="mobile-nav">
        <a href="dashboard.html"><span class="icon">📊</span>Inicio</a>
        <a href="songs.html"><span class="icon">🎵</span>Canciones</a>
        <a href="setlists.html"><span class="icon">📋</span>Set Lists</a>
        <a href="events.html"><span class="icon">📅</span>Eventos</a>
        <a href="rehearsals.html" class="active"><span class="icon">🎸</span>Ensayos</a>
    </nav>

    <!-- Modal Ver Ensayo -->
    <div class="modal-overlay" id="viewRehearsalModal">
        <div class="modal">
            <div class="modal-header">
                <h3>🎸 Ensayo</h3>
                <button class="modal-close" onclick="closeViewRehearsalModal()">&times;</button>
            </div>
            <div class="modal-body">
                <h2 id="viewRehearsalSong" style="margin-bottom: 4px;"></h2>
                <p id="viewRehearsalArtist" style="color: var(--text-secondary); margin-bottom: 8px;"></p>
                <p id="viewRehearsalDetails" style="color: var(--text-tertiary); font-size: 14px; margin-bottom: 16px;"></p>
                
                <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
                    <span class="badge badge-primary" id="viewRehearsalStatus">Estado</span>
                    <span class="badge badge-neutral" id="viewRehearsalDate">Fecha meta</span>
                </div>
                
                <div style="background: var(--bg-secondary); padding: 12px; border-radius: 8px;">
                    <strong style="font-size: 14px;">Notas:</strong>
                    <div id="viewRehearsalNotes" style="margin-top: 8px;"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="editCurrentRehearsal()">✏️ Editar</button>
                <button class="btn btn-primary" onclick="markCurrentAsReady()">✓ Marcar lista</button>
            </div>
        </div>
    </div>

    <!-- Modal Agregar a Ensayos -->
    <div class="modal-overlay" id="addRehearsalModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Agregar a Ensayos</h3>
                <button class="modal-close" onclick="closeAddRehearsalModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Canción *</label>
                    <select id="addRehearsalSong" required></select>
                </div>
                <div class="form-group">
                    <label>Fecha meta (opcional)</label>
                    <input type="date" id="addRehearsalDate">
                </div>
                <div class="form-group">
                    <label>Notas (opcional)</label>
                    <textarea id="addRehearsalNotes" rows="3" placeholder="Ej: Practicar intro, revisar puente..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeAddRehearsalModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="addToRehearsals()">Agregar</button>
            </div>
        </div>
    </div>

    <!-- Modal Editar Ensayo -->
    <div class="modal-overlay" id="editRehearsalModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Editar Ensayo</h3>
                <button class="modal-close" onclick="closeEditRehearsalModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editRehearsalId">
                <p style="font-weight: 600; margin-bottom: 16px;" id="editRehearsalSongName"></p>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="editRehearsalStatus">
                        <option value="pending">Pendiente</option>
                        <option value="in_progress">En progreso</option>
                        <option value="ready">Lista</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha meta</label>
                    <input type="date" id="editRehearsalDate">
                </div>
                <div class="form-group">
                    <label>Notas</label>
                    <textarea id="editRehearsalNotes" rows="4" placeholder="Notas sobre el ensayo..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeEditRehearsalModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveRehearsal()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/rehearsals.js"></script>
</body>
</html>
