<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ensayos - Music System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🎵 Music System</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
                <a href="songs.html"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html"><span class="icon">📅</span> Eventos</a>
                <a href="rehearsals.html" class="active"><span class="icon">🎸</span> Ensayos</a>
                <a href="musicians.html"><span class="icon">👥</span> Músicos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Config</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-details">
                        <h4 id="userName">Usuario</h4>
                        <span id="userRole">Rol</span>
                    </div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Ensayos</h1>
                <button class="btn btn-primary" onclick="openModal()">+ Agregar canción</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="icon">🔴</div>
                    <div class="number" id="highCount">0</div>
                    <div class="label">Alta prioridad</div>
                </div>
                <div class="stat-card">
                    <div class="icon">🟡</div>
                    <div class="number" id="mediumCount">0</div>
                    <div class="label">Media prioridad</div>
                </div>
                <div class="stat-card">
                    <div class="icon">🟢</div>
                    <div class="number" id="lowCount">0</div>
                    <div class="label">Baja prioridad</div>
                </div>
                <div class="stat-card">
                    <div class="icon">✅</div>
                    <div class="number" id="readyCount">0</div>
                    <div class="label">Listas</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Por ensayar</h3>
                    <div class="search-filters" style="margin: 0;">
                        <select id="filterPriority" onchange="renderRehearsals()">
                            <option value="">Todas</option>
                            <option value="high">Alta</option>
                            <option value="medium">Media</option>
                            <option value="low">Baja</option>
                        </select>
                    </div>
                </div>
                <div id="rehearsalsList"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>✅ Listas para repertorio</h3>
                </div>
                <div id="readyList"></div>
            </div>
        </main>
    </div>

    <!-- Modal Agregar a Ensayos -->
    <div class="modal-overlay" id="rehearsalModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Agregar a Ensayos</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Buscar canción</label>
                    <input type="text" id="searchSongInput" placeholder="Nombre o artista..." onkeyup="filterAvailableSongs()">
                </div>
                <div id="availableSongs" style="max-height: 200px; overflow-y: auto; margin-bottom: 20px;"></div>
                
                <div id="selectedSongInfo" style="display: none; padding: 12px; background: var(--bg-secondary); border-radius: var(--radius); margin-bottom: 20px;">
                    <strong>Seleccionada:</strong> <span id="selectedSongName"></span>
                    <input type="hidden" id="selectedSongId">
                </div>

                <div class="form-group">
                    <label>Prioridad</label>
                    <select id="rehearsalPriority">
                        <option value="high">🔴 Alta</option>
                        <option value="medium" selected>🟡 Media</option>
                        <option value="low">🟢 Baja</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha objetivo</label>
                    <input type="date" id="rehearsalTargetDate">
                </div>
                <div class="form-group">
                    <label>Notas</label>
                    <textarea id="rehearsalNotes" rows="2" placeholder="Qué practicar..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveRehearsal()">Agregar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/rehearsals.js"></script>
</body>
</html>
