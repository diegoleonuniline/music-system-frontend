<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" id="themeColor" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Dashboard - Music System Pro</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
    <div class="app">
        <!-- Header Mobile -->
        <header class="header">
            <div class="header-content">
                <div class="app-logo">
                    <div class="app-logo-icon">🎵</div>
                    <span>Music Pro</span>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <h1 style="font-size: 28px; font-weight: 700; margin-bottom: var(--space-xl);">Dashboard</h1>
            
            <!-- Stats -->
            <div class="stats">
                <div class="stat">
                    <div class="stat-icon songs">🎵</div>
                    <div>
                        <div class="stat-value" id="totalSongs">-</div>
                        <div class="stat-label">Canciones</div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-icon setlists">📋</div>
                    <div>
                        <div class="stat-value" id="totalSetlists">-</div>
                        <div class="stat-label">Set Lists</div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-icon events">📅</div>
                    <div>
                        <div class="stat-value" id="totalEvents">-</div>
                        <div class="stat-label">Eventos</div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-icon musicians">👥</div>
                    <div>
                        <div class="stat-value" id="totalMusicians">-</div>
                        <div class="stat-label">Músicos</div>
                    </div>
                </div>
            </div>

            <!-- Próximos Eventos -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">📅 Próximos Eventos</span>
                    <a href="events.html" class="btn btn-ghost btn-sm">Ver todos</a>
                </div>
                <div class="card-body no-padding" id="upcomingEvents">
                    <div class="loading"><div class="spinner"></div>Cargando...</div>
                </div>
            </div>

            <!-- Favoritas -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">⭐ Canciones Favoritas</span>
                    <a href="songs.html" class="btn btn-ghost btn-sm">Ver todas</a>
                </div>
                <div class="card-body no-padding" id="favoriteSongs">
                    <div class="loading"><div class="spinner"></div>Cargando...</div>
                </div>
            </div>
        </main>

        <!-- Nav Bottom -->
        <nav class="nav">
            <div class="nav-logo">
                <div class="nav-logo-icon">🎵</div>
                Music Pro
            </div>
            <div class="nav-items">
                <a href="dashboard.html" class="nav-item active">
                    <span class="icon">📊</span>
                    <span>Inicio</span>
                </a>
                <a href="songs.html" class="nav-item">
                    <span class="icon">🎵</span>
                    <span>Canciones</span>
                </a>
                <a href="setlists.html" class="nav-item">
                    <span class="icon">📋</span>
                    <span>Set Lists</span>
                </a>
                <a href="events.html" class="nav-item">
                    <span class="icon">📅</span>
                    <span>Eventos</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <span class="icon">⚙️</span>
                    <span>Config</span>
                </a>
            </div>
            <div class="nav-profile">
                <div class="nav-profile-avatar" id="navUserAvatar">U</div>
                <div class="nav-profile-info">
                    <div class="nav-profile-name" id="navUserName">Usuario</div>
                    <div class="nav-profile-role" id="navUserRole">Músico</div>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>
            </div>
        </nav>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
