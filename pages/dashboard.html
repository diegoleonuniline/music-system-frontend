<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dashboard - Music System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <meta name="theme-color" content="#ffffff" id="themeColor">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="app">
        <!-- Header móvil -->
        <header class="header">
            <div class="header-content">
                <h1>Dashboard</h1>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
                </div>
            </div>
        </header>

        <!-- Contenido -->
        <main class="main">
            <!-- Stats -->
            <div class="stats">
                <div class="stat">
                    <div class="stat-icon songs">🎵</div>
                    <div>
                        <div class="stat-value" id="totalSongs">0</div>
                        <div class="stat-label">Canciones</div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-icon setlists">📋</div>
                    <div>
                        <div class="stat-value" id="totalSetlists">0</div>
                        <div class="stat-label">Set Lists</div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-icon events">📅</div>
                    <div>
                        <div class="stat-value" id="totalEvents">0</div>
                        <div class="stat-label">Eventos</div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-icon musicians">👥</div>
                    <div>
                        <div class="stat-value" id="totalMusicians">0</div>
                        <div class="stat-label">Músicos</div>
                    </div>
                </div>
            </div>

            <!-- Próximos eventos -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Próximos Eventos</span>
                    <a href="events.html" class="btn btn-ghost btn-sm">Ver todos</a>
                </div>
                <div class="card-body no-padding" id="upcomingEvents">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Favoritas -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Canciones Favoritas</span>
                    <a href="songs.html" class="btn btn-ghost btn-sm">Ver todas</a>
                </div>
                <div class="card-body no-padding" id="favoriteSongs">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </main>

        <!-- Nav inferior -->
        <nav class="nav">
            <div class="nav-items">
                <a href="dashboard.html" class="nav-item active">
                    <span class="icon">🏠</span>
                    Inicio
                </a>
                <a href="songs.html" class="nav-item">
                    <span class="icon">🎵</span>
                    Canciones
                </a>
                <a href="setlists.html" class="nav-item">
                    <span class="icon">📋</span>
                    Set Lists
                </a>
                <a href="events.html" class="nav-item">
                    <span class="icon">📅</span>
                    Eventos
                </a>
                <a href="settings.html" class="nav-item">
                    <span class="icon">⚙️</span>
                    Config
                </a>
            </div>
            <div class="nav-logo hidden">🎵 Music System</div>
        </nav>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
