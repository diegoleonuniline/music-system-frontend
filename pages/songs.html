<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canciones - Music System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🎵 Music System</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
                <a href="songs.html" class="active"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html"><span class="icon">📅</span> Eventos</a>
                <a href="rehearsals.html"><span class="icon">🎸</span> Ensayos</a>
                <a href="musicians.html"><span class="icon">👥</span> Músicos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-details">
                        <h4 id="userName">Usuario</h4>
                        <span id="userRole">Rol</span>
                    </div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Canciones</h1>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-ghost" onclick="toggleView()">
                        <span id="viewIcon">☰</span> <span id="viewText">Tabla</span>
                    </button>
                    <button class="btn btn-primary" onclick="openModal()">+ Nueva canción</button>
                </div>
            </div>

            <div class="card">
                <div class="search-filters">
                    <input type="text" id="searchInput" placeholder="Buscar por nombre o artista..." onkeyup="filterSongs()">
                    <select id="filterCategory" onchange="filterSongs()">
                        <option value="">Categoría</option>
                    </select>
                    <select id="filterGenre" onchange="filterSongs()">
                        <option value="">Género</option>
                    </select>
                    <select id="filterType" onchange="filterSongs()">
                        <option value="">Tipo</option>
                        <option value="cover">Cover</option>
                        <option value="original">Original</option>
                        <option value="medley">Medley</option>
                    </select>
                    <select id="groupBy" onchange="renderSongs()">
                        <option value="">Ordenar A-Z</option>
                        <option value="artist">Agrupar por Artista</option>
                        <option value="category">Agrupar por Categoría</option>
                        <option value="genre">Agrupar por Género</option>
                    </select>
                </div>

                <div id="songsList">
                    <div class="loading">Cargando</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Nueva/Editar Canción -->
    <div class="modal-overlay" id="songModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Canción</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="songForm">
                    <input type="hidden" id="songId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" id="songName" required placeholder="Nombre de la canción">
                        </div>
                        <div class="form-group">
                            <label>Artista</label>
                            <input type="text" id="songArtist" placeholder="Artista original">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Categoría</label>
                            <select id="songCategory"></select>
                        </div>
                        <div class="form-group">
                            <label>Género</label>
                            <select id="songGenre"></select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo</label>
                            <select id="songType">
                                <option value="cover">Cover</option>
                                <option value="original">Original</option>
                                <option value="medley">Medley</option>
                                <option value="mashup">Mashup</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Idioma</label>
                            <select id="songLyricsType">
                                <option value="spanish">Español</option>
                                <option value="english">Inglés</option>
                                <option value="instrumental">Instrumental</option>
                                <option value="other">Otro</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>URL de Video</label>
                        <input type="url" id="songVideo" placeholder="https://youtube.com/watch?v=...">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Duración (seg)</label>
                            <input type="number" id="songDuration" placeholder="180">
                        </div>
                        <div class="form-group">
                            <label>BPM</label>
                            <input type="number" id="songBpm" placeholder="120">
                        </div>
                        <div class="form-group">
                            <label>Tonalidad</label>
                            <input type="text" id="songKey" placeholder="Am">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Letra</label>
                        <textarea id="songLyrics" rows="4" placeholder="Letra de la canción..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>Notas</label>
                        <textarea id="songNotes" rows="2" placeholder="Notas adicionales..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveSong()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Ver Canción -->
    <div class="modal-overlay" id="viewSongModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="viewSongTitle">Canción</h3>
                <button class="modal-close" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="modal-body" id="viewSongContent"></div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeViewModal()">Cerrar</button>
                <button class="btn btn-primary" onclick="openLyricsMode()" id="btnLyrics">📜 Ver Letra</button>
            </div>
        </div>
    </div>

    <!-- Modal Letra Grande (Vocalista) -->
    <div class="modal-overlay" id="lyricsModal" style="background: #0a0a0a; padding: 0;">
        <div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
            <div style="padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222;">
                <div>
                    <h2 style="color: #fff; font-size: 20px;" id="lyricsSongTitle">Canción</h2>
                    <p style="color: #888; font-size: 14px;" id="lyricsSongArtist">Artista</p>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <span class="badge badge-success" id="lyricsSongKey" style="font-size: 16px;"></span>
                    <span class="badge badge-warning" id="lyricsSongBpm" style="font-size: 16px;"></span>
                    <button class="btn btn-sm" onclick="changeFontSize(-2)">A-</button>
                    <button class="btn btn-sm" onclick="changeFontSize(2)">A+</button>
                    <button class="btn btn-danger btn-sm" onclick="closeLyricsMode()">✕ Cerrar</button>
                </div>
            </div>
            <div id="lyricsContent" style="flex: 1; overflow-y: auto; padding: 32px; display: flex; justify-content: center;">
                <pre style="color: #eee; font-size: 24px; line-height: 1.8; font-family: inherit; white-space: pre-wrap; max-width: 800px;" id="lyricsText"></pre>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/songs.js"></script>
</body>
</html>
