<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4F46E5">
    <title>Canciones - Caimán</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐊</text></svg>">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="logo">🐊</span>
                <h2>Caimán</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Inicio</a>
                <a href="songs.html" class="active"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html"><span class="icon">📅</span> Eventos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Config</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-info">
                        <h4 id="userName">Usuario</h4>
                        <span id="userRole">Rol</span>
                    </div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Salir</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Canciones</h1>
                <button class="btn btn-primary" onclick="openSongModal()">+ Nueva</button>
            </div>

            <div class="card">
                <div class="search-filters">
                    <input type="text" id="searchInput" placeholder="Buscar canciones..." onkeyup="filterSongs()">
                    <select id="groupBy" onchange="renderSongs()">
                        <option value="">Ordenar A-Z</option>
                        <option value="artist">Por Artista</option>
                        <option value="category">Por Categoría</option>
                        <option value="genre">Por Género</option>
                    </select>
                </div>

                <div class="filter-chips" id="categoryChips"></div>

                <div id="songsList">
                    <div class="loading">Cargando...</div>
                </div>
            </div>
        </main>
    </div>

    <nav class="mobile-nav">
        <a href="dashboard.html"><span class="icon">📊</span>Inicio</a>
        <a href="songs.html" class="active"><span class="icon">🎵</span>Canciones</a>
        <a href="setlists.html"><span class="icon">📋</span>Set Lists</a>
        <a href="events.html"><span class="icon">📅</span>Eventos</a>
        <a href="settings.html"><span class="icon">⚙️</span>Config</a>
    </nav>

    <div class="mobile-user">
        <div class="user-avatar" id="mobileUserAvatar">U</div>
        <div class="user-info">
            <h4 id="mobileUserName">Usuario</h4>
            <span id="mobileUserRole">Rol</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>
    </div>

    <!-- Modal Song -->
    <div class="modal-overlay" id="songModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="songModalTitle">Nueva Canción</h3>
                <button class="modal-close" onclick="closeSongModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="songId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" id="songName" required>
                    </div>
                    <div class="form-group">
                        <label>Artista</label>
                        <input type="text" id="songArtist">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="songCategory"></select>
                    </div>
                    <div class="form-group">
                        <label>Género</label>
                        <select id="songGenre"></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tonalidad</label>
                        <input type="text" id="songKey" placeholder="Am, C, G...">
                    </div>
                    <div class="form-group">
                        <label>BPM</label>
                        <input type="number" id="songBpm" placeholder="120">
                    </div>
                    <div class="form-group">
                        <label>Duración (seg)</label>
                        <input type="number" id="songDuration" placeholder="180">
                    </div>
                </div>
                <div class="form-group">
                    <label>Video URL</label>
                    <input type="url" id="songVideo" placeholder="https://youtube.com/...">
                </div>
                <div class="form-group">
                    <label>Letra</label>
                    <textarea id="songLyrics" rows="4" placeholder="Letra de la canción..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeSongModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveSong()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/songs.js"></script>
</body>
</html>
