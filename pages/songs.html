<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" id="themeColor" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Canciones - Music System Pro</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1>Canciones</h1>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
                </div>
            </div>
        </header>

        <main class="main">
            <!-- Search -->
            <div class="search-box">
                <span class="icon">🔍</span>
                <input type="text" class="form-input" id="searchInput" placeholder="Buscar canciones..." oninput="filterSongs()">
            </div>

            <!-- Filters -->
            <div class="filters" id="categoryFilters">
                <div class="filter-chip active" data-category="" onclick="filterByCategory('')">Todas</div>
            </div>

            <!-- View Controls -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-lg); gap: var(--space-md); flex-wrap: wrap;">
                <div class="view-toggle">
                    <button class="view-toggle-btn active" onclick="setView('list')" id="viewList">Lista</button>
                    <button class="view-toggle-btn" onclick="setView('table')" id="viewTable">Tabla</button>
                </div>
                <select class="form-input" style="width: auto; padding: var(--space-sm) var(--space-md); font-size: 13px;" id="groupBy" onchange="renderSongs()">
                    <option value="">Ordenar A-Z</option>
                    <option value="artist">Por Artista</option>
                    <option value="category">Por Categoría</option>
                    <option value="genre">Por Género</option>
                </select>
            </div>

            <!-- Songs List -->
            <div class="card">
                <div class="card-body no-padding" id="songsList">
                    <div class="loading"><div class="spinner"></div>Cargando...</div>
                </div>
            </div>
        </main>

        <!-- FAB -->
        <button class="fab admin-only" onclick="openSongModal()">+</button>

        <!-- Nav -->
        <nav class="nav">
            <div class="nav-logo"><div class="nav-logo-icon">🎵</div>Music Pro</div>
            <div class="nav-items">
                <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span>Inicio</span></a>
                <a href="songs.html" class="nav-item active"><span class="icon">🎵</span><span>Canciones</span></a>
                <a href="setlists.html" class="nav-item"><span class="icon">📋</span><span>Set Lists</span></a>
                <a href="events.html" class="nav-item"><span class="icon">📅</span><span>Eventos</span></a>
                <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span>Config</span></a>
            </div>
            <div class="nav-profile">
                <div class="nav-profile-avatar" id="navUserAvatar">U</div>
                <div class="nav-profile-info">
                    <div class="nav-profile-name" id="navUserName">Usuario</div>
                    <div class="nav-profile-role" id="navUserRole">Músico</div>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>
            </div>
        </nav>
    </div>

    <!-- Modal Song CRUD -->
    <div class="modal-overlay" id="songModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="songModalTitle">Nueva Canción</h3>
                <button class="modal-close" onclick="closeModal('songModal')">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="songId">
                <div class="form-group">
                    <label class="form-label">Nombre *</label>
                    <input type="text" class="form-input" id="songName" placeholder="Nombre de la canción">
                </div>
                <div class="form-group">
                    <label class="form-label">Artista</label>
                    <input type="text" class="form-input" id="songArtist" placeholder="Artista original">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Categoría</label>
                        <div class="form-inline">
                            <select class="form-input" id="songCategory"></select>
                            <button class="btn btn-secondary btn-sm" onclick="openInlineCreate('category')" title="Nueva categoría">+</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Género</label>
                        <div class="form-inline">
                            <select class="form-input" id="songGenre"></select>
                            <button class="btn btn-secondary btn-sm" onclick="openInlineCreate('genre')" title="Nuevo género">+</button>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tipo</label>
                        <select class="form-input" id="songType">
                            <option value="cover">Cover</option>
                            <option value="original">Original</option>
                            <option value="medley">Medley</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Idioma</label>
                        <select class="form-input" id="songLanguage">
                            <option value="spanish">Español</option>
                            <option value="english">Inglés</option>
                            <option value="instrumental">Instrumental</option>
                            <option value="other">Otro</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tonalidad</label>
                        <input type="text" class="form-input" id="songKey" placeholder="Ej: Am, C, G">
                    </div>
                    <div class="form-group">
                        <label class="form-label">BPM</label>
                        <input type="number" class="form-input" id="songBpm" placeholder="120">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Duración (seg)</label>
                        <input type="number" class="form-input" id="songDuration" placeholder="180">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">URL Video</label>
                    <input type="url" class="form-input" id="songVideo" placeholder="https://youtube.com/...">
                </div>
                <div class="form-group">
                    <label class="form-label">Letra</label>
                    <textarea class="form-input" id="songLyrics" rows="4" placeholder="Letra de la canción..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Notas</label>
                    <textarea class="form-input" id="songNotes" rows="2" placeholder="Notas para la banda..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('songModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveSong()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal View Song -->
    <div class="modal-overlay" id="viewSongModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="viewSongTitle">Canción</h3>
                <button class="modal-close" onclick="closeModal('viewSongModal')">✕</button>
            </div>
            <div class="modal-body" id="viewSongContent"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('viewSongModal')">Cerrar</button>
                <button class="btn btn-primary" onclick="openLyrics()" id="btnViewLyrics">📜 Ver Letra</button>
            </div>
        </div>
    </div>

    <!-- Lyrics Overlay -->
    <div class="lyrics-overlay" id="lyricsOverlay">
        <div class="lyrics-header">
            <div class="lyrics-info">
                <div class="lyrics-title" id="lyricsTitle">Canción</div>
                <div class="lyrics-artist" id="lyricsArtist">Artista</div>
            </div>
            <div class="lyrics-controls">
                <span class="badge badge-green" id="lyricsKey"></span>
                <span class="badge badge-orange" id="lyricsBpm"></span>
                <button class="btn btn-sm btn-secondary" onclick="changeFontSize(-2)">A-</button>
                <button class="btn btn-sm btn-secondary" onclick="changeFontSize(2)">A+</button>
                <button class="btn btn-sm btn-danger" onclick="closeLyrics()">✕</button>
            </div>
        </div>
        <div class="lyrics-body">
            <pre class="lyrics-text" id="lyricsText"></pre>
        </div>
    </div>

    <!-- Inline Create Modal -->
    <div class="modal-overlay" id="inlineCreateModal">
        <div class="modal" style="max-height: 300px;">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="inlineCreateTitle">Nuevo</h3>
                <button class="modal-close" onclick="closeModal('inlineCreateModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nombre *</label>
                    <input type="text" class="form-input" id="inlineCreateName" placeholder="Nombre">
                </div>
                <div class="form-group" id="inlineColorGroup">
                    <label class="form-label">Color</label>
                    <input type="color" class="form-input" id="inlineCreateColor" value="#007aff" style="height: 44px; padding: 4px;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('inlineCreateModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveInlineCreate()">Crear</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/songs.js"></script>
</body>
</html>
