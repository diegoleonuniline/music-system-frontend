<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canciones - Music System</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🎵 Music System</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
                <a href="songs.html" class="active"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html"><span class="icon">📅</span> Eventos</a>
                <a href="rehearsals.html"><span class="icon">🎸</span> Ensayos</a>
                <a href="musicians.html"><span class="icon">👥</span> Músicos</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-details">
                        <h4 id="userName">Usuario</h4>
                        <span id="userRole">Rol</span>
                    </div>
                </div>
                <button class="btn btn-danger btn-sm btn-block" onclick="logout()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>🎵 Canciones</h1>
                <button class="btn btn-primary" onclick="openModal()">+ Nueva Canción</button>
            </div>

            <div class="card">
                <div class="search-filters">
                    <input type="text" id="searchInput" placeholder="Buscar canción o artista..." onkeyup="filterSongs()">
                    <select id="filterCategory" onchange="filterSongs()">
                        <option value="">Todas las categorías</option>
                    </select>
                    <select id="filterGenre" onchange="filterSongs()">
                        <option value="">Todos los géneros</option>
                    </select>
                    <select id="filterType" onchange="filterSongs()">
                        <option value="">Todos los tipos</option>
                        <option value="cover">Cover</option>
                        <option value="original">Original</option>
                        <option value="medley">Medley</option>
                        <option value="mashup">Mashup</option>
                    </select>
                    <select id="groupBy" onchange="renderSongs()">
                        <option value="">Sin agrupar</option>
                        <option value="artist">Por Artista</option>
                        <option value="category">Por Categoría</option>
                        <option value="genre">Por Género</option>
                        <option value="song_type">Por Tipo</option>
                    </select>
                </div>

                <div id="songsList">Cargando...</div>
            </div>
        </main>
    </div>

    <!-- Modal Nueva/Editar Canción -->
    <div class="modal-overlay" id="songModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Canción</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="songForm">
                    <input type="hidden" id="songId">
                    <div class="form-group">
                        <label>Nombre de la canción *</label>
                        <input type="text" id="songName" required>
                    </div>
                    <div class="form-group">
                        <label>Artista</label>
                        <input type="text" id="songArtist">
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="songCategory"></select>
                    </div>
                    <div class="form-group">
                        <label>Género</label>
                        <select id="songGenre"></select>
                    </div>
                    <div class="form-group">
                        <label>Tipo</label>
                        <select id="songType">
                            <option value="cover">Cover</option>
                            <option value="original">Original</option>
                            <option value="medley">Medley</option>
                            <option value="mashup">Mashup</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tipo de letra</label>
                        <select id="songLyricsType">
                            <option value="spanish">Español</option>
                            <option value="english">Inglés</option>
                            <option value="instrumental">Instrumental</option>
                            <option value="other">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>URL de Video (YouTube)</label>
                        <input type="url" id="songVideo" placeholder="https://youtube.com/watch?v=...">
                    </div>
                    <div class="form-group">
                        <label>Duración (segundos)</label>
                        <input type="number" id="songDuration" placeholder="180">
                    </div>
                    <div class="form-group">
                        <label>BPM</label>
                        <input type="number" id="songBpm" placeholder="120">
                    </div>
                    <div class="form-group">
                        <label>Tonalidad</label>
                        <input type="text" id="songKey" placeholder="Am, C, G...">
                    </div>
                    <div class="form-group">
                        <label>Letra</label>
                        <textarea id="songLyrics" rows="4" placeholder="Letra de la canción..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Notas</label>
                        <textarea id="songNotes" rows="2" placeholder="Notas adicionales..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveSong()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/songs.js"></script>
</body>
</html>
