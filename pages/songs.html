<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#4F46E5">
    <title>Canciones - Caimán</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐊</text></svg>">
</head>
<body>
    <header class="mobile-header">
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <span class="logo">🐊</span>
        <h1>Canciones</h1>
    </header>
    <div class="sidebar-overlay" onclick="closeMobileMenu()"></div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header"><span class="logo">🐊</span><h2>Caimán</h2></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Inicio</a>
                <a href="songs.html" class="active"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html"><span class="icon">📅</span> Eventos</a>
                <a href="rehearsals.html"><span class="icon">🎸</span> Ensayos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-info"><h4 id="userName">Usuario</h4><span id="userRole">Rol</span></div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Canciones</h1>
                <button class="btn btn-primary" onclick="openSongModal()">+ Nueva</button>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="search-filters">
                        <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="filterSongs()">
                        <select id="filterCategory" onchange="filterSongs()"></select>
                        <select id="filterGenre" onchange="filterSongs()"></select>
                        <div class="view-toggle">
                            <button class="active" onclick="setViewMode('cards')">Tarjetas</button>
                            <button onclick="setViewMode('table')">Tabla</button>
                        </div>
                    </div>
                    
                    <div class="group-chips" style="margin-top: 12px;">
                        <span style="font-size: 13px; color: var(--text-secondary); margin-right: 8px;">Agrupar:</span>
                        <button class="filter-chip active" data-group="none" onclick="setGroupBy('none')">Ninguno</button>
                        <button class="filter-chip" data-group="artist" onclick="setGroupBy('artist')">Artista</button>
                        <button class="filter-chip" data-group="category" onclick="setGroupBy('category')">Categoría</button>
                        <button class="filter-chip" data-group="genre" onclick="setGroupBy('genre')">Género</button>
                        <button class="filter-chip" data-group="key" onclick="setGroupBy('key')">Tono</button>
                        <button class="filter-chip" data-group="favorite" onclick="setGroupBy('favorite')">Favoritas</button>
                    </div>
                </div>
                <div id="songsContainer"><div class="loading">Cargando...</div></div>
            </div>
        </main>
    </div>

    <nav class="mobile-nav">
        <a href="dashboard.html"><span class="icon">📊</span>Inicio</a>
        <a href="songs.html" class="active"><span class="icon">🎵</span>Canciones</a>
        <a href="setlists.html"><span class="icon">📋</span>Set Lists</a>
        <a href="events.html"><span class="icon">📅</span>Eventos</a>
        <a href="rehearsals.html"><span class="icon">🎸</span>Ensayos</a>
    </nav>

    <!-- Modal Ver Canción -->
    <div class="modal-overlay" id="viewSongModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3>🎵 Canción</h3>
                <button class="modal-close" onclick="closeViewSongModal()">&times;</button>
            </div>
            <div class="modal-body">
                <h2 id="viewSongTitle" style="margin-bottom: 4px;"></h2>
                <p id="viewSongArtist" style="color: var(--text-secondary); margin-bottom: 8px;"></p>
                <p id="viewSongDetails" style="color: var(--text-tertiary); font-size: 14px; margin-bottom: 16px;"></p>
                <div id="viewSongLinks" style="margin-bottom: 16px;"></div>
                <div style="background: var(--bg-secondary); padding: 12px; border-radius: 8px; max-height: 300px; overflow-y: auto;">
                    <strong>Letra:</strong>
                    <div id="viewSongLyrics" style="margin-top: 8px; white-space: pre-wrap;"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="editCurrentSong()">✏️ Editar</button>
                <button class="btn btn-danger" onclick="deleteCurrentSong()">🗑️ Eliminar</button>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar Canción -->
    <div class="modal-overlay" id="songModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="songModalTitle">Nueva Canción</h3>
                <button class="modal-close" onclick="closeSongModal()">&times;</button>
            </div>
            <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
                <input type="hidden" id="songId">
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" id="songName" required placeholder="Nombre de la canción">
                </div>
                <div class="form-group">
                    <label>Artista</label>
                    <input type="text" id="songArtist" placeholder="Artista o banda">
                </div>
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Tono</label>
                        <select id="songKey">
                            <option value="">-</option>
                            <option value="C">C</option><option value="C#">C#</option>
                            <option value="D">D</option><option value="D#">D#</option>
                            <option value="E">E</option><option value="F">F</option>
                            <option value="F#">F#</option><option value="G">G</option>
                            <option value="G#">G#</option><option value="A">A</option>
                            <option value="A#">A#</option><option value="B">B</option>
                            <option value="Cm">Cm</option><option value="C#m">C#m</option>
                            <option value="Dm">Dm</option><option value="D#m">D#m</option>
                            <option value="Em">Em</option><option value="Fm">Fm</option>
                            <option value="F#m">F#m</option><option value="Gm">Gm</option>
                            <option value="G#m">G#m</option><option value="Am">Am</option>
                            <option value="A#m">A#m</option><option value="Bm">Bm</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>BPM</label>
                        <input type="number" id="songBpm" placeholder="120" min="30" max="300">
                    </div>
                    <div class="form-group">
                        <label>Compás</label>
                        <select id="songTimeSignature">
                            <option value="4/4">4/4</option>
                            <option value="3/4">3/4</option>
                            <option value="6/8">6/8</option>
                            <option value="2/4">2/4</option>
                            <option value="5/4">5/4</option>
                            <option value="7/8">7/8</option>
                            <option value="12/8">12/8</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Duración (segundos)</label>
                    <input type="number" id="songDuration" placeholder="180" min="0">
                </div>
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="songCategory" onchange="onCategoryChange()"></select>
                        <div id="newCategoryGroup" style="display: none; margin-top: 8px;">
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="newCategoryName" placeholder="Nueva categoría">
                                <button class="btn btn-primary btn-sm" onclick="createCategory()">Crear</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Género</label>
                        <select id="songGenre" onchange="onGenreChange()"></select>
                        <div id="newGenreGroup" style="display: none; margin-top: 8px;">
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="newGenreName" placeholder="Nuevo género">
                                <button class="btn btn-primary btn-sm" onclick="createGenre()">Crear</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>URL Video (YouTube, etc)</label>
                    <input type="url" id="songVideoUrl" placeholder="https://youtube.com/...">
                </div>
                <div class="form-group">
                    <label>URL Audio (Spotify, etc)</label>
                    <input type="url" id="songAudioUrl" placeholder="https://spotify.com/...">
                </div>
                <div class="form-group">
                    <label>Letra</label>
                    <textarea id="songLyrics" rows="6" placeholder="Pega aquí la letra..."></textarea>
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="songFavorite" style="width: 18px; height: 18px;">
                        <span>⭐ Marcar como favorita</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeSongModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveSong()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Recursos -->
    <div class="modal-overlay" id="resourcesModal">
        <div class="modal" style="max-width: 550px;">
            <div class="modal-header">
                <h3>📎 Recursos: <span id="resourcesSongName">Canción</span></h3>
                <button class="modal-close" onclick="closeResourcesModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                    <select id="resourcesFilter" onchange="loadResources()" style="flex: 1;">
                        <option value="all">Todos</option>
                        <option value="mine">Solo míos</option>
                        <option value="shared">Compartidos</option>
                    </select>
                    <button class="btn btn-primary btn-sm" onclick="openAddResourceModal()">+ Agregar</button>
                </div>
                <div id="resourcesList" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <!-- Modal Agregar Recurso -->
    <div class="modal-overlay" id="addResourceModal">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header">
                <h3>Agregar Recurso</h3>
                <button class="modal-close" onclick="closeAddResourceModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="resourceType" onchange="toggleResourceContentType()">
                        <option value="lyrics">📝 Letra</option>
                        <option value="chords">🎸 Acordes</option>
                        <option value="tabs">🎼 Tablatura</option>
                        <option value="notes">📒 Notas</option>
                        <option value="pdf">📕 PDF</option>
                        <option value="image">🖼️ Imagen</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Título (opcional)</label>
                    <input type="text" id="resourceTitle" placeholder="Ej: Acordes para bajo">
                </div>
                <div class="form-group" id="resourceContentGroup">
                    <label>Contenido</label>
                    <textarea id="resourceContent" rows="10" placeholder="Pega aquí..." style="font-family: monospace;"></textarea>
                </div>
                <div class="form-group" id="resourceFileGroup" style="display: none;">
                    <label>Archivo (max 10MB)</label>
                    <input type="file" id="resourceFileInput" accept=".pdf,.jpg,.jpeg,.png,.webp">
                    <div id="uploadProgress" style="display: none; margin-top: 8px;">
                        <div style="background: var(--bg-tertiary); border-radius: 4px; overflow: hidden;">
                            <div id="uploadProgressBar" style="height: 8px; background: var(--primary); width: 0%;"></div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="resourceShared" checked style="width: 18px; height: 18px;">
                        <span>Compartir con el grupo</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeAddResourceModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveResource()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Ver Recurso -->
    <div class="modal-overlay" id="viewResourceModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="viewResourceTitle">Contenido</h3>
                <button class="modal-close" onclick="closeViewResourceModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="viewResourceContent" style="white-space: pre-wrap; font-family: monospace; max-height: 500px; overflow-y: auto; background: var(--bg-secondary); padding: 12px; border-radius: 8px;"></div>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/songs.js"></script>
</body>
</html>
