<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Canciones - Music System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <meta name="theme-color" content="#ffffff" id="themeColor">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1>Canciones</h1>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
                </div>
            </div>
        </header>

        <main class="main">
            <!-- Búsqueda -->
            <div class="search-box">
                <span class="icon">🔍</span>
                <input type="text" class="form-input" id="searchInput" placeholder="Buscar canción..." oninput="filterSongs()">
            </div>

            <!-- Filtros -->
            <div class="filters" id="categoryFilters"></div>

            <!-- Lista de canciones -->
            <div class="card">
                <div class="card-body no-padding" id="songsList">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </main>

        <!-- FAB agregar -->
        <button class="fab" onclick="openSongModal()">+</button>

        <!-- Nav -->
        <nav class="nav">
            <div class="nav-items">
                <a href="dashboard.html" class="nav-item"><span class="icon">🏠</span>Inicio</a>
                <a href="songs.html" class="nav-item active"><span class="icon">🎵</span>Canciones</a>
                <a href="setlists.html" class="nav-item"><span class="icon">📋</span>Set Lists</a>
                <a href="events.html" class="nav-item"><span class="icon">📅</span>Eventos</a>
                <a href="settings.html" class="nav-item"><span class="icon">⚙️</span>Config</a>
            </div>
        </nav>
    </div>

    <!-- Modal Canción -->
    <div class="modal-overlay" id="songModal">
        <div class="modal" style="max-height: 90vh;">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Canción</h3>
                <button class="modal-close" onclick="closeModal('songModal')">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="songId">
                <div class="form-group">
                    <label class="form-label">Nombre *</label>
                    <input type="text" class="form-input" id="songName" placeholder="Nombre de la canción">
                </div>
                <div class="form-group">
                    <label class="form-label">Artista</label>
                    <input type="text" class="form-input" id="songArtist" placeholder="Artista original">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Categoría</label>
                        <div class="form-inline">
                            <select class="form-input" id="songCategory"></select>
                            <button type="button" class="btn btn-secondary btn-sm admin-only" onclick="showNewCat()">+</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Género</label>
                        <div class="form-inline">
                            <select class="form-input" id="songGenre"></select>
                            <button type="button" class="btn btn-secondary btn-sm admin-only" onclick="showNewGen()">+</button>
                        </div>
                    </div>
                </div>
                <!-- Nuevo categoría inline -->
                <div class="form-group hidden" id="newCatForm">
                    <div class="form-inline">
                        <input type="text" class="form-input" id="newCatName" placeholder="Nueva categoría">
                        <button class="btn btn-primary btn-sm" onclick="createCat()">Crear</button>
                        <button class="btn btn-ghost btn-sm" onclick="hideNewCat()">×</button>
                    </div>
                </div>
                <!-- Nuevo género inline -->
                <div class="form-group hidden" id="newGenForm">
                    <div class="form-inline">
                        <input type="text" class="form-input" id="newGenName" placeholder="Nuevo género">
                        <button class="btn btn-primary btn-sm" onclick="createGen()">Crear</button>
                        <button class="btn btn-ghost btn-sm" onclick="hideNewGen()">×</button>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tonalidad</label>
                        <input type="text" class="form-input" id="songKey" placeholder="Ej: Am">
                    </div>
                    <div class="form-group">
                        <label class="form-label">BPM</label>
                        <input type="number" class="form-input" id="songBpm" placeholder="120">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Video URL</label>
                    <input type="url" class="form-input" id="songVideo" placeholder="https://youtube.com/...">
                </div>
                <div class="form-group">
                    <label class="form-label">Letra</label>
                    <textarea class="form-input" id="songLyrics" rows="4" placeholder="Letra de la canción..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Notas</label>
                    <textarea class="form-input" id="songNotes" rows="2" placeholder="Notas..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('songModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveSong()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Ver Canción -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="viewTitle">Canción</h3>
                <button class="modal-close" onclick="closeModal('viewModal')">×</button>
            </div>
            <div class="modal-body" id="viewContent"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('viewModal')">Cerrar</button>
                <button class="btn btn-primary" id="btnLyrics" onclick="openLyrics()">📜 Ver Letra</button>
            </div>
        </div>
    </div>

    <!-- Lyrics View -->
    <div class="lyrics-overlay" id="lyricsView">
        <div class="lyrics-header">
            <div class="lyrics-info">
                <div class="lyrics-title" id="lyricsTitle">Canción</div>
                <div class="lyrics-artist" id="lyricsArtist">Artista</div>
            </div>
            <div class="lyrics-controls">
                <span class="badge badge-green" id="lyricsKey"></span>
                <span class="badge badge-orange" id="lyricsBpm"></span>
                <button class="btn btn-ghost btn-sm" onclick="changeFontSize(-2)">A-</button>
                <button class="btn btn-ghost btn-sm" onclick="changeFontSize(2)">A+</button>
                <button class="btn btn-secondary btn-sm" onclick="closeLyrics()">×</button>
            </div>
        </div>
        <div class="lyrics-body">
            <div class="lyrics-text" id="lyricsText"></div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/songs.js"></script>
</body>
</html>
