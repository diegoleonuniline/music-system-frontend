<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4F46E5">
    <title>Canciones - Caimán</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐊</text></svg>">
</head>
<body>
    <header class="mobile-header">
        <button class="hamburger-btn" onclick="toggleMobileMenu()">☰</button>
        <span class="logo">🐊</span>
        <h1>Canciones</h1>
    </header>
    <div class="sidebar-overlay" onclick="closeMobileMenu()"></div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="logo">🐊</span>
                <h2>Caimán</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">📊</span> Inicio</a>
                <a href="songs.html" class="active"><span class="icon">🎵</span> Canciones</a>
                <a href="setlists.html"><span class="icon">📋</span> Set Lists</a>
                <a href="events.html"><span class="icon">📅</span> Eventos</a>
                <a href="rehearsals.html"><span class="icon">🎸</span> Ensayos</a>
                <a href="settings.html"><span class="icon">⚙️</span> Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-info">
                        <h4 id="userName">Usuario</h4>
                        <span id="userRole">Rol</span>
                    </div>
                </div>
                <button class="btn btn-ghost btn-block btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Canciones</h1>
                <button class="btn btn-primary" onclick="openSongModal()">+ Nueva</button>
            </div>

            <div class="card">
                <div class="search-filters">
                    <input type="text" id="searchInput" placeholder="Buscar..." onkeyup="filterSongs()">
                    <select id="groupBy" onchange="renderSongs()">
                        <option value="">A-Z</option>
                        <option value="artist">Artista</option>
                        <option value="category">Categoría</option>
                        <option value="genre">Género</option>
                    </select>
                    <div class="view-toggle">
                        <button class="active" onclick="setViewMode('list')">Lista</button>
                        <button onclick="setViewMode('table')">Tabla</button>
                    </div>
                </div>
                <div class="filter-chips" id="categoryChips"></div>
                <div id="songsList"><div class="loading">Cargando...</div></div>
            </div>
        </main>
    </div>

    <nav class="mobile-nav">
        <a href="dashboard.html"><span class="icon">📊</span>Inicio</a>
        <a href="songs.html" class="active"><span class="icon">🎵</span>Canciones</a>
        <a href="setlists.html"><span class="icon">📋</span>Set Lists</a>
        <a href="events.html"><span class="icon">📅</span>Eventos</a>
        <a href="rehearsals.html"><span class="icon">🎸</span>Ensayos</a>
    </nav>

    <div class="modal-overlay" id="songModal">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="songModalTitle">Nueva Canción</h3>
                <button class="modal-close" onclick="closeSongModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="songId">
                <div class="form-row">
                    <div class="form-group"><label>Nombre *</label><input type="text" id="songName" required></div>
                    <div class="form-group"><label>Artista</label><input type="text" id="songArtist"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Categoría</label><select id="songCategory"></select></div>
                    <div class="form-group"><label>Género</label><select id="songGenre"></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Tono</label><input type="text" id="songKey" placeholder="Am, C..."></div>
                    <div class="form-group"><label>BPM</label><input type="number" id="songBpm"></div>
                    <div class="form-group"><label>Duración</label><input type="number" id="songDuration" placeholder="seg"></div>
                </div>
                <div class="form-group"><label>Video URL</label><input type="url" id="songVideo"></div>
                <div class="form-group"><label>Letra</label><textarea id="songLyrics" rows="3"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeSongModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveSong()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/songs.js"></script>
</body>
</html>
