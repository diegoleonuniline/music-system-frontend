<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Configuración - Music System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <meta name="theme-color" content="#ffffff" id="themeColor">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1>Configuración</h1>
            </div>
        </header>

        <main class="main">
            <!-- Perfil -->
            <div class="card">
                <div class="card-body" style="display:flex;align-items:center;gap:16px">
                    <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:24px;color:white;font-weight:600" id="userAvatar">U</div>
                    <div style="flex:1">
                        <div style="font-weight:600;font-size:17px" id="userName">Usuario</div>
                        <div class="text-muted" id="userRole">Rol</div>
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="logout()">Salir</button>
                </div>
            </div>

            <!-- Tema -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Apariencia</span>
                </div>
                <div class="card-body">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <div>
                            <div style="font-weight:500">Tema oscuro</div>
                            <div class="text-muted text-sm">Cambia la apariencia de la app</div>
                        </div>
                        <button class="btn btn-secondary" id="themeBtn" onclick="toggleTheme()" style="min-width:80px">
                            <span id="themeBtnText">🌙</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Categorías -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Categorías</span>
                    <button class="btn btn-primary btn-sm admin-only" onclick="openCatModal()">+ Nueva</button>
                </div>
                <div class="card-body no-padding" id="categoriesList">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Géneros -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Géneros</span>
                    <button class="btn btn-primary btn-sm admin-only" onclick="openGenModal()">+ Nuevo</button>
                </div>
                <div class="card-body no-padding" id="genresList">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Grupos (Solo Super Admin) -->
            <div class="card hidden" id="groupsSection">
                <div class="card-header">
                    <span class="card-title">Grupos</span>
                    <button class="btn btn-primary btn-sm" onclick="openGroupModal()">+ Nuevo</button>
                </div>
                <div class="card-body no-padding" id="groupsList"></div>
            </div>
        </main>

        <nav class="nav">
            <div class="nav-items">
                <a href="dashboard.html" class="nav-item"><span class="icon">🏠</span>Inicio</a>
                <a href="songs.html" class="nav-item"><span class="icon">🎵</span>Canciones</a>
                <a href="setlists.html" class="nav-item"><span class="icon">📋</span>Set Lists</a>
                <a href="events.html" class="nav-item"><span class="icon">📅</span>Eventos</a>
                <a href="settings.html" class="nav-item active"><span class="icon">⚙️</span>Config</a>
            </div>
        </nav>
    </div>

    <!-- Modal Categoría -->
    <div class="modal-overlay" id="catModal">
        <div class="modal" style="max-width:400px">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="catModalTitle">Nueva Categoría</h3>
                <button class="modal-close" onclick="closeModal('catModal')">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="catId">
                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-input" id="catName" placeholder="Nombre">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('catModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveCat()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Género -->
    <div class="modal-overlay" id="genModal">
        <div class="modal" style="max-width:400px">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="genModalTitle">Nuevo Género</h3>
                <button class="modal-close" onclick="closeModal('genModal')">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="genId">
                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-input" id="genName" placeholder="Nombre">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('genModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveGen()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Grupo -->
    <div class="modal-overlay" id="groupModal">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h3 id="groupModalTitle">Nuevo Grupo</h3>
                <button class="modal-close" onclick="closeModal('groupModal')">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="groupId">
                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-input" id="groupName" placeholder="Nombre del grupo">
                </div>
                <div class="form-group">
                    <label class="form-label">Plan</label>
                    <select class="form-input" id="groupPlan"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('groupModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveGroup()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/settings.js"></script>
</body>
</html>
