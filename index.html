<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4F46E5">
    <title>Caimán - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐊</text></svg>">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="app-logo">🐊</div>
            <h1>Caimán</h1>
            <p>Sistema para músicos</p>
        </div>
        
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="text" id="email" required placeholder="tu@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <div style="position: relative;">
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" style="padding-right: 45px;">
                    <button type="button" onclick="togglePassword('password', this)" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; padding: 4px;">👁️</button>
                </div>
            </div>
            <div id="errorMsg" class="error-msg"></div>
            <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
        </form>
    </div>

    <script src="js/config.js"></script>
    <script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁️';
        }
    }
    
    // Si ya hay sesión, ir al dashboard
    if (localStorage.getItem('token')) {
        window.location.href = 'pages/dashboard.html';
    }
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
